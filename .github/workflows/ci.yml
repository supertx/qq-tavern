name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-startup:
    runs-on: windows-latest
    strategy:
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test Windows startup modes
        env:
          TEST_POWERSHELL: ${{ matrix.powershell }}
        run: python scripts/start_windows_test.py
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: onboard/package-lock.json
      - name: Test login and startup modes
        run: |
          npm --prefix onboard ci --ignore-scripts --no-audit --no-fund
          npm --prefix onboard test
          python3 scripts/start_test.py
      - name: Install integration dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Verify modules
        run: go mod verify
      - name: Verify release artifacts
        run: python3 scripts/check_release.py
      - name: Test
        run: go test -race -count=1 -timeout=180s ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/qq-tavern ./cmd/qq-tavern
      - name: Build container
        run: docker build -t qq-tavern:ci .
      - name: Build login container
        run: docker build -f onboard/Dockerfile -t qq-tavern-login:ci .
      - name: Verify login volume handoff and startup configurations
        env:
          TEST_APP_IMAGE: qq-tavern:ci
          TEST_LOGIN_IMAGE: qq-tavern-login:ci
        run: python3 scripts/test_login_docker.py
