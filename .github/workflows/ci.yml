name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install integration dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Verify modules
        run: go mod verify
      - name: Verify release artifacts
        run: python3 scripts/check_release.py
      - name: Test
        run: go test -race -count=1 -timeout=180s ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/qq-tavern ./cmd/qq-tavern
      - name: Build container
        run: docker build -t qq-tavern:ci .
